name: Resolve Issue with OpenHands

# OpenHands issue->PR resolver, wired to Daffie's self-hosted LiteLLM (BYOK).
#
# HOW IT WORKS
#   1. You label an issue (or PR) `fix-me`, OR comment `@openhands-agent ...`.
#   2. This calls OpenHands' reusable workflow on a GitHub runner (free compute).
#   3. OpenHands calls the model at LLM_BASE_URL (your LiteLLM) using LLM_API_KEY
#      (the LiteLLM master key). The model is github_copilot/claude-* under the
#      hood -> billed to AsafMah's Copilot Enterprise quota.
#   4. It opens a draft PR as the PAT_USERNAME/PAT_TOKEN user (lurebat).
#
# NETWORK REQUIREMENT (the one open decision):
#   The GitHub-hosted runner must be able to REACH your LiteLLM. localhost:51805
#   is NOT reachable from GitHub's cloud. Pick ONE:
#     A) Public, master-key-protected LiteLLM subdomain (e.g. https://litellm.asafshq.win)
#        -> set repo secret LLM_BASE_URL to that URL. Simplest.
#     B) Self-hosted runner on your tailnet (gaming PC or a small VM), set the repo
#        variable TARGET_RUNNER to its label -> LLM_BASE_URL can stay http://litellm:51805
#        (or the tailscale name). Nothing public. See README-openhands.md.

on:
  issues:
    types: [labeled]
  pull_request:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  call-openhands-resolver:
    # NOTE: the reusable workflow lives in OpenHands-Web, NOT OpenHands/OpenHands.
    # (The upstream example file references OpenHands/OpenHands/...@main, which 404s —
    #  verified against the live repo on 2026-06-09. Use OpenHands-Web.)
    uses: OpenHands/OpenHands-Web/.github/workflows/openhands-resolver.yml@main
    with:
      macro: ${{ vars.OPENHANDS_MACRO || '@openhands-agent' }}
      max_iterations: ${{ fromJson(vars.OPENHANDS_MAX_ITER || 30) }}
      base_container_image: ${{ vars.OPENHANDS_BASE_CONTAINER_IMAGE || '' }}
      # Your LiteLLM model name. litellm_proxy/ prefix tells OpenHands to treat
      # LLM_BASE_URL as an OpenAI-compatible proxy (which it is).
      LLM_MODEL: ${{ vars.LLM_MODEL || 'litellm_proxy/claude-sonnet-4.5' }}
      target_branch: ${{ vars.TARGET_BRANCH || 'main' }}
      pr_type: ${{ vars.OPENHANDS_PR_TYPE || 'draft' }}
      runner: ${{ vars.TARGET_RUNNER || 'ubuntu-latest' }}
    secrets:
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
      PAT_USERNAME: ${{ secrets.PAT_USERNAME }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}

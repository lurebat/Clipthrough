name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Release (Windows x64)
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF -replace '^refs/tags/','' } else { '${{ inputs.version }}' }
          if ([string]::IsNullOrWhiteSpace($tag) -or -not $tag.StartsWith('v')) {
            throw "Release version must be a v-prefixed tag, e.g. v0.5.1."
          }
          $version = $tag.TrimStart('v')
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore .\Clipthrough.slnx

      - name: Install Velopack CLI
        # Pinned to match the Velopack library version in Clipthrough.csproj. Left
        # floating, a vpk release could change the package format independently of the
        # library that has to read it - and the app doing the reading is the *previous*
        # version already installed on someone's machine, which cannot be fixed
        # afterwards because the fix would ship through the updater that broke.
        run: dotnet tool install -g vpk --version 1.2.0

      - name: Publish (framework-dependent)
        run: >
          dotnet publish .\Clipthrough\Clipthrough.csproj
          --configuration Release
          -p:Version=${{ steps.ver.outputs.version }}
          --output artifacts\publish

      - name: Package zip
        shell: pwsh
        run: |
          $zip = "artifacts\Clipthrough-${{ steps.ver.outputs.version }}-win-x64.zip"
          Compress-Archive -Path artifacts\publish\* -DestinationPath $zip
          echo "ZIP_PATH=$zip" >> $env:GITHUB_ENV

      - name: Build Velopack package
        shell: pwsh
        run: |
          vpk pack `
            --packId Clipthrough `
            --packVersion ${{ steps.ver.outputs.version }} `
            --packDir artifacts\publish `
            --mainExe Clipthrough.exe `
            --outputDir artifacts\velopack

      - name: Stage release assets
        shell: pwsh
        run: |
          $releaseDir = "artifacts\release"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          Copy-Item "artifacts\Clipthrough-${{ steps.ver.outputs.version }}-win-x64.zip" $releaseDir
          Get-ChildItem "artifacts\velopack" -File | Copy-Item -Destination $releaseDir

          Get-ChildItem $releaseDir -File |
            Sort-Object Name |
            ForEach-Object {
              $hash = Get-FileHash -Algorithm SHA256 -Path $_.FullName
              "{0}  {1}" -f $hash.Hash.ToLowerInvariant(), $_.Name
            } |
            Set-Content -Path (Join-Path $releaseDir "SHA256SUMS.txt") -Encoding ascii

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: Clipthrough-${{ steps.ver.outputs.version }}-win-x64
          path: artifacts\release\*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Clipthrough ${{ steps.ver.outputs.tag }}
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          # Use GitHub's date+semver logic so that when two release workflows
          # publish in parallel, the higher semver wins "latest" instead of
          # whoever happens to finish second. Avoids breaking the Velopack
          # /releases/latest/download/ feed for users on older versions.
          make_latest: legacy
          files: |
            artifacts/release/*

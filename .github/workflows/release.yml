name: release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Release (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF -replace '^refs/tags/','' } else { '${{ inputs.version }}' }
          $version = $tag.TrimStart('v')
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore .\Clipthrough.slnx

      - name: Publish (framework-dependent)
        run: >
          dotnet publish .\Clipthrough\Clipthrough.csproj
          --configuration Release
          -p:Version=${{ steps.ver.outputs.version }}
          --output artifacts\publish

      - name: Package zip
        shell: pwsh
        run: |
          $zip = "artifacts\Clipthrough-${{ steps.ver.outputs.version }}-win-x64.zip"
          Compress-Archive -Path artifacts\publish\* -DestinationPath $zip
          echo "ZIP_PATH=$zip" >> $env:GITHUB_ENV

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: Clipthrough-${{ steps.ver.outputs.version }}-win-x64
          path: artifacts\Clipthrough-${{ steps.ver.outputs.version }}-win-x64.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Clipthrough ${{ steps.ver.outputs.tag }}
          draft: true
          generate_release_notes: true
          files: |
            artifacts/Clipthrough-${{ steps.ver.outputs.version }}-win-x64.zip

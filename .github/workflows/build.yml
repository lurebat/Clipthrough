name: build

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore .\Clipthrough.slnx

      - name: Test
        run: dotnet test .\Clipthrough.Tests\Clipthrough.Tests.csproj --configuration Release --no-restore

      - name: Build
        run: dotnet build .\Clipthrough\Clipthrough.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish .\Clipthrough\Clipthrough.csproj --configuration Release --no-build --runtime win-x64 --self-contained false --output artifacts\win-x64

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: Clipthrough-win-x64
          path: artifacts\win-x64\**
